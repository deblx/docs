name: Refresh npm lockfile

on:
  push:
    branches: [vitepress-migration]
    paths:
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "deblx-docs"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh npm dependency lockfile"
            git push origin HEAD:vitepress-migration
          fi
