name: Build and Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deblx-docs-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify dependency auto-merge script
        run: |
          node --check scripts/merge-dependabot.mjs
          node --test scripts/merge-dependabot.test.mjs
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check documentation
        run: npm run check
      - name: Build VitePress
        run: npm run docs:build
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          cname: docs.deblx.com
          publish_dir: docs/.vitepress/dist
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: publish VitePress documentation'
