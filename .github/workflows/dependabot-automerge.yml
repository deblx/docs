name: Merge Verified Dependency Updates

on:
  workflow_run:
    workflows: ["Build and Deploy Documentation"]
    types: [completed]
  schedule:
    - cron: "17 05 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: deblx-dependabot-verified-merges
  cancel-in-progress: false

jobs:
  merge-verified-update:
    if: >
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted maintenance script
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Merge verified Dependabot updates (patch, minor and major)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/merge-dependabot.mjs
